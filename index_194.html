<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d9e1db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Polaco">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Registro Polaco</title>
<meta name="color-scheme" content="only light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mostrador a la izquierda (productos), ticket de la venta a la derecha; en celular el ticket baja. */
:root{
  --bg:#d9e1db; --surface:#ffffff; --ink:#1d2621; --muted:#66746b; --line:#c3cec6;
  --accent:#1f6b4a; --accent-ink:#ffffff; --ember:#c8582a; --ember-soft:#fbe9df;
  --ticket:#fffdf6; --chip:#e6ece8; --tint:#f6f8f6; --danger:#b3261e; --scrim:rgba(18,24,20,.45);
  color-scheme: only light;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}

*{box-sizing:border-box}
html,body,button,a,input,select,label{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.main > section{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--ember)}
.hoy{display:flex;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.hoy b{font-family:var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.hoy .g b{color:var(--accent)}
.menubtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.menubtn svg{width:22px;height:22px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok i{background:var(--accent)} .save.busy i{background:var(--ember)} .save.err i{background:var(--danger)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}

/* Mostrador en cuadrados */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px 8px 8px;font:600 18px var(--f-display);cursor:pointer;min-width:0}
.back svg{width:22px;height:22px;transform:rotate(90deg);flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{position:relative;min-width:0;max-width:100%}
.card .hit{width:100%;aspect-ratio:5/4;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid #b9c5bd;box-shadow:0 2px 0 #b9c5bd,0 4px 10px rgba(30,50,40,.10);border-radius:18px;padding:12px 8px;cursor:pointer;font:inherit;color:inherit;text-align:center}
.card .hit:active{transform:translateY(2px);box-shadow:0 0 0 #b9c5bd}
.card .ico{width:54px;height:54px;font-size:32px;border-radius:14px}
.card .nm{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.15;overflow-wrap:anywhere;max-width:100%}
.card .pr{font:700 13px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.card.fold .hit{background:#cfe3d7;border-color:#9fbfad;box-shadow:0 2px 0 #9fbfad,0 4px 10px rgba(30,50,40,.10)}
.card.fold .ico{background:#ffffffcc}
.card.on .hit{background:var(--ember-soft);border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.card .q{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--ember);color:#fff;font:700 15px var(--f-num);display:grid;place-items:center;pointer-events:none}
.card.fold .q{background:var(--accent)}
.card .menos{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 20px var(--f-num);display:grid;place-items:center;cursor:pointer;line-height:1}
.card .st{position:absolute;bottom:8px;right:8px;font:700 11px var(--f-num);padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--ink);pointer-events:none}
.card .st.low{background:var(--ember-soft);color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}
.card.out .hit{opacity:.45;cursor:not-allowed}
.card.out .st{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){.card .hit{transition:transform .08s,background .15s}}
.empty-list{grid-column:1/-1;padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.empty-list strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:4px}

.ico{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:24px;line-height:1;overflow:hidden;padding:0}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.picker .up{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.picker .up .btn{font-size:13px;padding:8px 12px;height:auto}
.picker .up small{color:var(--muted);font-size:12px;align-self:center}
.r{text-align:right}.c{text-align:center}

/* Botones */
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--ember);color:var(--surface)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* Ticket */
aside.tk{position:sticky;top:16px;width:100%;min-width:0;justify-self:stretch;align-self:start}
.ticket{width:100%;box-sizing:border-box}
.ticket{background:var(--ticket);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 18px 28px;
  -webkit-mask:radial-gradient(circle 7px at 10px 100%,#0000 98%,#000) 0 0/20px 100% repeat-x;mask:radial-gradient(circle 7px at 10px 100%,#0000 98%,#000) 0 0/20px 100% repeat-x}
.ticket h2{font-family:var(--f-display);font-size:22px;margin:0}
.lines{list-style:none;margin:12px 0;padding:12px 0;border-block:1px dashed var(--line);display:grid;gap:8px;font-family:var(--f-num);font-size:14px;font-variant-numeric:tabular-nums}
.lines li{display:grid;grid-template-columns:minmax(80px,1fr) auto auto;gap:8px;align-items:center}
.lines .ln{min-width:0;overflow-wrap:break-word;word-break:normal;font-family:var(--f-body);font-weight:500}
.lines .lq{display:flex;align-items:center;gap:4px}
.lines .lq button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--f-num);cursor:pointer;line-height:1}
.lines .lq button:disabled{opacity:.35;cursor:not-allowed}
.lines .lq output{min-width:22px;text-align:center;font-weight:700}
.lines .sub{min-width:80px;text-align:right;white-space:nowrap}
.lines .empty{color:var(--muted);font-family:var(--f-body);display:block}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total strong{white-space:nowrap;font:700 28px var(--f-num);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .go{grid-column:1/-1;padding:14px;font-size:16px}
.bar{display:none}
@media (max-width:820px){
  body{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  aside.tk{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,30,24,.10);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  aside.tk .ticket{display:none;-webkit-mask:none;mask:none;border-radius:14px;max-height:55vh;overflow:auto;margin-bottom:10px;padding:14px}
  aside.tk.open .ticket{display:block}
  aside.tk .actions .go,aside.tk .total{display:none}
  .bar{display:flex;align-items:center;gap:10px}
  .bar .sum{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:4px 0}
  .bar .sum b{display:block;font:700 22px var(--f-num);font-variant-numeric:tabular-nums;line-height:1.1}
  .bar .sum small{display:block;color:var(--muted);font-size:12px}
  .bar .sum svg{width:22px;height:22px;flex:none;color:var(--muted)}
  aside.tk.open .bar .sum svg{transform:rotate(180deg)}
  .bar .go{padding:14px 26px;font-size:17px;border-radius:12px}
}
.chev{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--chip)}
.chev svg{width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){.chev svg,.bar .sum svg{transition:transform .2s}}
/* Mesas */
.mesas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 10px;scrollbar-width:none}
.mesas::-webkit-scrollbar{display:none}
.mchip{flex:none;min-width:54px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 19px var(--f-num);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.05;padding:0 10px}
.mchip small{font:700 10px var(--f-num);margin-top:2px}
.mchip.mostr{font:600 14px var(--f-body);padding:0 14px}
.mchip.ocup{background:var(--ember-soft);border-color:var(--ember);color:var(--ember)}
.mchip.act{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mchip.act.ocup small{color:var(--ember-soft)}
/* Menú */
dialog.sheet{width:min(420px,calc(100vw - 32px))}
.menu{display:grid;gap:8px}
.menu .item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px;font:600 16px var(--f-body);cursor:pointer;text-align:left}
.menu .item svg{width:20px;height:20px;color:var(--accent);flex:none}
.menu .io{display:flex;gap:8px;justify-content:center;padding-top:6px}
.menu .io .iconbtn{width:48px;height:48px;border-radius:12px}
.menu .io .iconbtn svg{width:22px;height:22px}

/* Ventanas emergentes */
.costo{position:relative}
.costo .num{padding-left:20px}
.costo::before{content:"$";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font:500 13px var(--f-num)}
.mg{font:500 11px var(--f-num);color:var(--muted);text-align:right;grid-column:6;margin-top:-6px}
dialog.wide{width:min(760px,calc(100vw - 32px))}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 18px var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .g{font:500 12px var(--f-num);color:var(--accent)}
.tile small{color:var(--muted);font-size:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.tile{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}}
.days{display:grid;gap:8px}
.dia{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dia > button{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:12px;align-items:center;padding:12px 14px}
.dia > button:focus-visible{outline:2px solid var(--ember);outline-offset:-2px}
.dia .f{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:capitalize}
.dia .f small{display:block;font:500 12px var(--f-body);color:var(--muted);text-transform:none}
.dia .t{text-align:right;font:700 15px var(--f-num);font-variant-numeric:tabular-nums}
.dia .t small{display:block;font-weight:500;font-size:12px;color:var(--accent)}
.dia[data-open="true"] .chev svg{transform:rotate(180deg)}
.dia .in{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:12px;background:var(--tint)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px;text-align:right;font-family:var(--f-num);border-bottom:1px solid var(--line)}
.tbl td:first-child{font-family:var(--f-body);font-weight:500}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl .gan{color:var(--accent)}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.vlist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto 34px 34px;gap:10px;align-items:center;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px}
.vlist .h{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.vlist .d{min-width:0;overflow-wrap:anywhere}
.vlist .a{font-family:var(--f-num);font-weight:700}
.reset{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.reset form{display:grid;gap:10px;background:var(--ember-soft);border:1px solid var(--danger);border-radius:12px;padding:12px}
.reset .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reset input{max-width:140px;text-align:center;letter-spacing:.3em}
.reset .err{color:var(--danger);font-size:13px;font-weight:600}
.iconbtn.del{color:var(--danger)}
li.conf{display:flex!important;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--ember-soft)!important;border-color:var(--danger)!important;padding:10px 12px!important}
li.conf .q{min-width:0;flex:1 1 180px;font-size:14px}
li.conf label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
li.conf .bt{display:flex;gap:6px}
li.conf .btn{padding:7px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin:0}
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:var(--scrim)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.dlg header{border:0;padding:20px 20px 0;align-items:center}
.dlg h3{font-family:var(--f-display);font-size:24px;margin:0}
.dlg .body{padding:16px 20px;overflow:auto;display:grid;gap:10px}
.dlg footer{padding:14px 20px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.srow{display:grid;grid-template-columns:36px minmax(0,1fr) 54px 84px 54px 96px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow .ico,.erow .ico{width:36px;height:36px;font-size:20px;border-radius:10px}
.srow .now,.srow .after{font:500 14px var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.srow .after{color:var(--accent);font-weight:700}
.num{width:100%;font:500 15px var(--f-num);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right}
.txt{width:100%;font:500 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ord{display:grid;gap:2px}
.ord button{width:30px;height:17px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0}
.ord button svg{width:14px;height:14px}
.ord button:disabled{opacity:.3;cursor:default}
.erow{display:grid;grid-template-columns:30px 36px minmax(0,1fr) 100px 36px;gap:8px;align-items:center}
.erow .ico{border:1px solid var(--line);cursor:pointer}
.erow .del{color:var(--danger)}
.confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--ember-soft);border-radius:10px;padding:8px 10px;font-size:14px;flex-wrap:wrap}
.picker{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.picker button{font-size:22px;height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--chip);box-shadow:inset 0 0 0 2px var(--accent)}
.egroup{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--tint)}
.egroup .erow:not(.fold){padding-left:14px;border-left:2px solid var(--line)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;text-align:right}
.mv{grid-column:3/5;font-size:13px;padding:6px 8px}
.btn.sm{font-size:13px;padding:7px 10px;justify-self:start}
.sgroup{display:flex;align-items:center;gap:8px;padding-top:12px;font-family:var(--f-display);font-weight:600;font-size:16px}
.sgroup .ico{width:28px;height:28px;font-size:16px;border-radius:8px}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.colhead{display:grid;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
@media (max-width:480px){
  .srow{grid-template-columns:32px minmax(0,1fr) 84px 96px;grid-template-areas:"i n n b" "i a f c"}
  .srow .ico{grid-area:i}.srow .nm{grid-area:n}.srow .num{grid-area:f}.srow .now{grid-area:a;text-align:left}.srow .after{grid-area:b}.srow .costo{grid-area:c}
  .colhead.s{display:none}
  .mg{grid-column:1/-1;margin-top:-4px}
}

.toast .undo{margin-left:12px;border:0;background:var(--ember);color:#fff;font:700 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
@media (max-width:820px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.hoybtn{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:block}
.hoybtn .hoy{text-decoration:underline dotted var(--line);text-underline-offset:4px}
.toast{display:flex;align-items:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}

/* Impresión directa (cuando la página se abre fuera de Claude) */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0}
  .wrap,.toast,dialog,aside.tk{display:none!important}
  #printArea{display:block}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <h1>Registro <span>Polaco</span></h1>
      <button class="hoybtn" id="openHoy" aria-label="Ver ventas de hoy"><span class="hoy"><span>Hoy <b id="caja">$ 0</b></span><span><b id="nVentas">0</b> ventas</span><span class="g">Ganancia <b id="gan">—</b></span></span></button>
    </div>
    <button class="menubtn" id="openMenu" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <div class="main">
    <section aria-label="Productos">
      <div class="mesas" id="mesas" role="group" aria-label="Mesas"></div>
      <div class="crumb" id="crumb" hidden></div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="tk" id="tk">
      <div class="ticket">
        <h2 id="tkTitle">Ticket</h2>
        <ul class="lines" id="lines"></ul>
        <div class="total"><span class="label">Total</span><strong id="total">$ 0</strong></div>
        <div class="actions">
          <button class="btn ghost" id="limpiar">Limpiar</button>
          <button class="btn ghost" id="imprimir">Imprimir</button>
          <button class="btn go" id="cobrar">Cobrar</button>
        </div>
      </div>
      <div class="bar">
        <button class="sum" id="barSum" aria-label="Ver ticket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg><span><b id="barTotal">$ 0</b><small id="barCant">Ticket vacío</small></span></button>
        <button class="btn go" id="cobrar2">Cobrar</button>
      </div>
    </aside>
  </div>
</div>

<dialog id="dlgHoy">
  <div class="dlg">
    <header><h3>Ventas de hoy</h3><strong id="hoyTotal" style="font-family:var(--f-num)"></strong></header>
    <div class="body"><ol class="vlist" id="hoyList"></ol></div>
    <footer><button type="button" class="btn ghost" data-close>Cerrar</button></footer>
  </div>
</dialog>

<dialog id="dlgCobrado" class="sheet">
  <div class="dlg">
    <div class="body" style="text-align:center;padding-top:24px;gap:4px">
      <span class="label" id="cobMesa">Cobrado</span>
      <strong id="cobTotal" style="font:700 36px var(--f-num)"></strong>
      <p style="margin:10px 0 0;font:600 18px var(--f-display)">¿Imprimir el ticket?</p>
    </div>
    <footer style="justify-content:space-between">
      <button type="button" class="btn ghost" id="cobDeshacer" style="color:var(--danger)">Deshacer</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="btn ghost" id="cobNo" style="padding:12px 22px">No</button>
        <button type="button" class="btn go" id="cobSi" style="padding:12px 22px">Imprimir</button>
      </span>
    </footer>
  </div>
</dialog>

<dialog id="dlgMenu" class="sheet">
  <div class="dlg">
    <header><h3>Menú</h3><span class="save" id="save"></span></header>
    <div class="body menu">
      <button class="item" id="openHist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Historial</button>
      <button class="item" id="openStock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Cargar stock</button>
      <button class="item" id="openEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Editar productos</button>
      <div class="io">
        <button class="iconbtn" id="btnExport" title="Exportar" aria-label="Exportar datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
        <button class="iconbtn" id="btnImport" title="Importar" aria-label="Importar datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg></button>
      </div>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
    <footer><button type="button" class="btn ghost" data-close>Cerrar</button></footer>
  </div>
</dialog>

<dialog id="dlgStock">
  <form class="dlg" id="formStock" method="dialog">
    <header>
      <h3>Cargar stock</h3>
      <div class="seg" role="group" aria-label="Modo de carga">
        <button type="button" data-mode="sumar" aria-pressed="true">Sumar ingreso</button>
        <button type="button" data-mode="fijar" aria-pressed="false">Fijar cantidad</button>
      </div>
    </header>
    <div class="body">
      <div class="colhead s srow" style="border:0;padding:0"><span></span><span>Producto</span><span class="r">Actual</span><span class="r" id="colIn">Ingresa</span><span class="r">Queda</span><span class="r">Costo c/u</span></div>
      <div id="stockRows"></div>
    </div>
    <footer>
      <button type="button" class="btn ghost" data-close>Cancelar</button>
      <button type="submit" class="btn go" id="saveStock">Guardar stock</button>
    </footer>
  </form>
</dialog>

<dialog id="dlgHist" class="wide">
  <div class="dlg">
    <header><h3>Historial</h3><button type="button" class="btn ghost" data-close>Cerrar</button></header>
    <div class="body" id="histBody"></div>
  </div>
</dialog>

<dialog id="dlgImport">
  <div class="dlg">
    <header><h3>Importar datos</h3></header>
    <div class="body" id="impBody"></div>
    <footer>
      <button type="button" class="btn ghost" data-close>Cancelar</button>
      <button type="button" class="btn danger" id="impOk">Reemplazar todo</button>
    </footer>
  </div>
</dialog>

<dialog id="dlgEdit">
  <div class="dlg">
    <header><h3>Productos</h3><span class="save" id="save2"></span></header>
    <div class="body">
      <label class="sgroup" style="padding-top:0;justify-content:space-between" for="cantMesas">Mesas <input class="num" id="cantMesas" type="number" min="0" max="60" inputmode="numeric" style="width:90px"></label>
      <div class="colhead erow"><span></span><span>Ícono</span><span>Nombre</span><span class="r">Precio $</span><span></span></div>
      <div id="editRows" style="display:grid;gap:10px"></div>
      <div class="addbar"><button type="button" class="btn ghost" id="addProd">+ Producto</button><button type="button" class="btn ghost" id="addFold">+ Carpeta</button></div>
    </div>
    <footer><button type="button" class="btn go" data-close>Listo</button></footer>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script>
const ICONOS = ["📁","🥤","💧","🧃","🍺","🍷","☕","🧉","🧊","🌭","🥪","🍖","🥩","🍗","🍔","🍟","🍕","🌮","🥟","🥐","🍞","🥗","🧀","🍦","🍫","🍬","🍪","🧂","🌶️","🔥","🛒","📦","🥫","🍾","⭐"];
const SVG_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const SVG_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
const SVG_PRINT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>';
// Solo se usan si la página se abre fuera de Claude (sin base de datos)
const BASE_LOCAL = [
  {id:"gaseosa",nombre:"Gaseosa",precio:3000,stock:null,icono:"🥤"},
  {id:"agua",nombre:"Agua",precio:2000,stock:null,icono:"💧"},
  {id:"choripan",nombre:"Choripán",precio:6000,stock:null,icono:"🌭"},
  {id:"bondiola",nombre:"Bondiola",precio:10000,stock:null,icono:"🥪"},
  {id:"varios",nombre:"Varios",precio:2000,stock:null,icono:"🛒"},
];
const LS_KEY = "registro-polaco-v1";

let productos = [], ventas = [];
// Mostrador: venta que se cobra en el momento. Mesas: cuentas abiertas que se cobran al final.
let carritoMostrador = {}, carrito = carritoMostrador, cuentaActiva = null;
let mesasCfg = { cantidad: 8, abiertas: {} };   // abiertas: { "4": { items:{prodId:cant}, desde: ts } }
function vaciar(obj){ for (const k in obj) delete obj[k]; }
function irA(n){
  cuentaActiva = n;
  if (n === null) carrito = carritoMostrador;
  else { const k = String(n); mesasCfg.abiertas[k] ||= { items:{}, desde: Date.now() }; carrito = mesasCfg.abiertas[k].items; }
  $("#tk").classList.remove("open");
  render();
}
function limpiarMesasVacias(){ for (const k in mesasCfg.abiertas) if (!Object.keys(mesasCfg.abiertas[k].items||{}).length && String(cuentaActiva)!==k) delete mesasCfg.abiertas[k]; }
// Lo cargado en otras cuentas queda reservado
function reservado(pid){
  let r = 0;
  if (cuentaActiva !== null) r += carritoMostrador[pid]||0;
  for (const k in mesasCfg.abiertas) if (k !== String(cuentaActiva)) r += mesasCfg.abiertas[k].items?.[pid]||0;
  return r;
}
let mesasSucias = false, tMesas = null;
function guardarMesas(){
  mesasSucias = true; clearTimeout(tMesas);
  tMesas = setTimeout(() => {
    limpiarMesasVacias();
    const copia = JSON.parse(JSON.stringify(mesasCfg));
    if (modo === "db") {
      cola = cola.then(() => db.doc("registro/mesas").set(copia)).then(()=>{ mesasSucias = false; setSave("ok","Guardado"); })
        .catch(() => { mesasSucias = false; setSave("err","No se pudieron guardar las mesas"); });
    } else { mesasSucias = false; guardarLocal(); }
  }, 350);
}
let db = null, modo = "cargando";
const $ = s => document.querySelector(s);
const pesos = n => "$ " + Math.round(n).toLocaleString("es-AR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoyStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tieneStock = p => p.stock !== null && p.stock !== undefined && p.stock !== "";

/* ---------- Guardado ---------- */
function setSave(estado, texto){
  for (const el of [$("#save"), $("#save2")]) { if (!el) continue; el.className = "save " + estado; el.innerHTML = "<i></i><span>"+texto+"</span>"; }
  if (estado === "err") toast(texto);
}
let cola = Promise.resolve();
function guardarProductos(){
  const copia = JSON.parse(JSON.stringify(productos));
  if (modo === "db") {
    setSave("busy","Guardando…");
    cola = cola.then(() => db.doc("registro/productos").set({items: copia}))
      .then(() => setSave("ok","Guardado"))
      .catch(() => setSave("err","No se pudo guardar"));
  } else guardarLocal();
}
function guardarVenta(v){
  if (modo === "db") {
    setSave("busy","Guardando…");
    return db.collection("ventas").doc(v.id).set(v).then(()=>setSave("ok","Guardado")).catch(()=>setSave("err","No se pudo guardar la venta"));
  }
  guardarLocal();
}
function borrarVenta(id){
  if (modo === "db") { setSave("busy","Borrando…"); return db.collection("ventas").doc(id).delete().then(()=>setSave("ok","Guardado")).catch(()=>setSave("err","No se pudo borrar la venta")); }
  ventas = ventas.filter(v => v.id !== id);
  guardarLocal();
}
/* ---------- Borrar una venta ---------- */
let borrandoVenta = null;
function confVentaHTML(v){
  const conStock = v.items.some(i => { const p = productos.find(x=>x.id===i.id); return p && tieneStock(p); });
  return `<li class="conf">
    <span class="q">¿Borrar la venta N° ${v.numero} de las ${v.hora} por <b>${pesos(v.total)}</b>?</span>
    ${conStock ? `<label><input type="checkbox" id="dev-${v.id}" checked> Devolver al stock</label>` : ""}
    <span class="bt"><button type="button" class="btn ghost" data-nodelv>No</button><button type="button" class="btn danger" data-sidelv="${v.id}">Borrar</button></span>
  </li>`;
}
function refrescarListas(){ render(); if ($("#dlgHist").open) renderHist(); if ($("#dlgHoy").open) renderHoy(); }
function renderHoy(){
  const deHoy = ventasDeHoy();
  $("#hoyTotal").textContent = pesos(resumen(deHoy).total);
  $("#hoyList").innerHTML = deHoy.length ? deHoy.slice().reverse().map(v => borrandoVenta===v.id ? confVentaHTML(v) : `<li>
      <span class="h">${hora24(v.hora)}</span>
      <span class="d">${v.mesa?`<b>Mesa ${v.mesa}</b> · `:""}${esc(v.items.map(i=>i.cant+" "+i.nombre).join(", "))}</span>
      <span class="a">${pesos(v.total)}</span>
      <button type="button" class="iconbtn" data-print="${v.id}" aria-label="Imprimir ticket N° ${v.numero}">${SVG_PRINT}</button>
      <button type="button" class="iconbtn del" data-delv="${v.id}" aria-label="Borrar venta N° ${v.numero}">${SVG_TRASH}</button>
    </li>`).join("") : `<p class="hint">Todavía no hay ventas hoy.</p>`;
}
$("#openHoy").onclick = () => { borrandoVenta = null; renderHoy(); $("#dlgHoy").showModal(); };
// Deshacer la última venta cobrada: la borra y devuelve el stock
function deshacerVenta(v){
  let cambio = false;
  for (const i of v.items) { const p = productos.find(x=>x.id===i.id); if (p && tieneStock(p)) { p.stock += i.cant; cambio = true; } }
  if (cambio) guardarProductos();
  borrarVenta(v.id); refrescarListas(); toast("Venta deshecha");
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.delv) { borrandoVenta = b.dataset.delv; refrescarListas(); }
  else if (b.hasAttribute("data-nodelv")) { borrandoVenta = null; refrescarListas(); }
  else if (b.dataset.sidelv) {
    const v = ventas.find(x => x.id === b.dataset.sidelv); if (!v) return;
    const devolver = $("#dev-"+v.id)?.checked;
    borrandoVenta = null;
    if (devolver) {
      let cambio = false;
      for (const i of v.items) { const p = productos.find(x=>x.id===i.id); if (p && tieneStock(p)) { p.stock += i.cant; cambio = true; } }
      if (cambio) guardarProductos();
    }
    borrarVenta(v.id); refrescarListas();
    toast("Venta N° " + v.numero + " borrada" + (devolver ? " y stock devuelto" : ""));
  }
});
function guardarLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({productos, ventas, mesas: mesasCfg})); setSave("ok","Guardado en este navegador"); }
  catch { setSave("err","Este navegador no permite guardar"); }
}
function cargarLocal(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY)||"null"); if (d) { productos=d.productos||[]; ventas=d.ventas||[]; if (d.mesas) mesasCfg=d.mesas; return; } } catch {}
  productos = JSON.parse(JSON.stringify(BASE_LOCAL));
}

async function iniciar(){
  render();
  let ns = null;
  try { ns = window.claude?.use ? await window.claude.use("db") : null; } catch { ns = null; }
  if (ns) {
    db = ns; modo = "db"; setSave("ok","Guardado automático");
    db.doc("registro/productos").onSnapshot(s => {
      productos = s.exists ? JSON.parse(JSON.stringify(s.data().items||[])) : [];
      limpiarCarrito(); render(); if ($("#dlgEdit").open && !editando) renderEdit();
    }, () => setSave("err","Sin conexión con los datos"));
    db.doc("registro/mesas").onSnapshot(s => {
      if (mesasSucias) return;
      const d = s.exists ? JSON.parse(JSON.stringify(s.data())) : { cantidad: 8, abiertas: {} };
      mesasCfg = { cantidad: d.cantidad ?? 8, abiertas: d.abiertas || {} };
      if (cuentaActiva !== null) { const k=String(cuentaActiva); mesasCfg.abiertas[k] ||= { items:{}, desde: Date.now() }; carrito = mesasCfg.abiertas[k].items; }
      render();
    }, () => {});
    db.collection("ventas").onSnapshot(q => {
      ventas = q.docs.map(d => d.data()).sort((a,b)=>a.ts-b.ts); render(); if ($("#dlgHist").open) renderHist();
    }, () => setSave("err","Sin conexión con los datos"));
  } else {
    modo = "local"; cargarLocal(); guardarLocal(); render();
  }
}
const esCarpeta = x => !!x && x.tipo === "carpeta";
const carpetas = () => productos.filter(esCarpeta);
const enCarpetaValida = p => !!p.carpeta && productos.some(c => c.id === p.carpeta && esCarpeta(c));
const hijos = id => productos.filter(p => !esCarpeta(p) && p.carpeta === id);
// Orden de la lista: carpetas con sus productos adentro, y productos sueltos, según el orden guardado
function orden(){
  const out = [];
  for (const x of productos) {
    if (esCarpeta(x)) out.push({c:x, hijos:hijos(x.id)});
    else if (!enCarpetaValida(x)) out.push({p:x});
  }
  return out;
}
let abiertas = new Set();
try { abiertas = new Set(JSON.parse(localStorage.getItem(LS_KEY+"-abiertas")||"[]")); } catch {}
function recordarAbiertas(){ try { localStorage.setItem(LS_KEY+"-abiertas", JSON.stringify([...abiertas])); } catch {} }
function limpiarCarrito(){
  for (const c of [carritoMostrador, ...Object.values(mesasCfg.abiertas).map(m=>m.items||{})])
    for (const k in c) if (!productos.find(p=>p.id===k)) delete c[k];
}

/* ---------- Mostrador y ticket ---------- */
let carpetaActual = null;
const icoCarpeta = c => c.imagen ? `<img src="${esc(c.imagen)}" alt="">` : esc(c.icono || "📁");
function render(){
  if (carpetaActual && !productos.some(c => c.id === carpetaActual && esCarpeta(c))) carpetaActual = null;
  const grid = $("#grid"), crumb = $("#crumb");
  if (carpetaActual) {
    const c = productos.find(x => x.id === carpetaActual), hs = hijos(c.id);
    crumb.hidden = false;
    crumb.innerHTML = `<button class="back" data-back>${SVG_CHEV}<span>${esc(c.nombre)}</span></button>`;
    grid.innerHTML = hs.length ? hs.map(tarjetaProducto).join("") : `<div class="empty-list">Carpeta vacía</div>`;
  } else {
    crumb.hidden = true;
    const lista = orden();
    grid.innerHTML = lista.length
      ? lista.map(it => it.p ? tarjetaProducto(it.p) : tarjetaCarpeta(it.c, it.hijos)).join("")
      : (modo==="cargando" ? `<div class="empty-list">Cargando…</div>` : `<div class="empty-list"><strong>Sin productos</strong>Menú → Editar productos</div>`);
  }
  renderMesas();
  const items = itemsCarrito();
  const total = items.reduce((s,i)=>s+i.subtotal,0), cant = items.reduce((s,i)=>s+i.cant,0);
  $("#tkTitle").textContent = cuentaActiva === null ? "Ticket" : "Mesa " + cuentaActiva;
  $("#lines").innerHTML = items.length ? items.map(i=>`<li>
      <span class="ln">${esc(i.nombre)}</span>
      <span class="lq"><button data-m="${i.id}" aria-label="Quitar uno de ${esc(i.nombre)}">−</button><output>${i.cant}</output><button data-p="${i.id}" aria-label="Sumar uno de ${esc(i.nombre)}" ${i.cant >= disponible(productos.find(x=>x.id===i.id)||{}) ? "disabled" : ""}>+</button></span>
      <span class="sub">${pesos(i.subtotal)}</span></li>`).join("")
    : `<li class="empty">Vacío</li>`;
  $("#total").textContent = pesos(total);
  $("#barTotal").textContent = pesos(total);
  $("#barCant").textContent = (cuentaActiva === null ? "" : `Mesa ${cuentaActiva} · `) + (cant ? `${cant} ${cant===1?"producto":"productos"}` : "vacío");
  $("#cobrar").disabled = $("#cobrar2").disabled = $("#limpiar").disabled = $("#imprimir").disabled = !items.length;
  if (!items.length) $("#tk").classList.remove("open");
  const deHoy = ventasDeHoy();
  $("#nVentas").textContent = deHoy.length;
  const r = resumen(deHoy);
  $("#caja").textContent = pesos(r.total);

// Totales de un grupo de ventas. La ganancia solo cuenta los productos que tenían costo al momento de vender.
function resumen(lista){
  let total=0, ganancia=0, conCosto=0, sinCosto=0;
  for (const v of lista) for (const i of v.items) {
    total += i.subtotal;
    if (typeof i.costo === "number") { ganancia += (i.precio - i.costo) * i.cant; conCosto += i.cant; } else sinCosto += i.cant;
  }
  return {total, ganancia, conCosto, sinCosto, n: lista.length};
}

function hora24(h){
  const m = /^(\d{1,2}):(\d{2})\s*([ap])/i.exec((h||"").replace(/\u00a0/g," "));
  if (!m) return h || "";
  let H = +m[1] % 12; if (m[3].toLowerCase()==="p") H += 12;
  return String(H).padStart(2,"0")+":"+m[2];
}

// Recorta al centro en cuadrado y la achica para que cargue rápido
function achicar(file, lado){
  return new Promise((ok,ko)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const m=Math.min(img.naturalWidth,img.naturalHeight); const c=document.createElement("canvas"); c.width=c.height=lado;
      c.getContext("2d").drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,lado,lado);
      URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):ko(),"image/png"); };
    img.onerror=()=>{URL.revokeObjectURL(u);ko();}; img.src=u;
  });
}

  const c = {id:uid(), tipo:"carpeta", nombre:"Nueva carpeta", icono:"📁"};
  productos.push(c); abiertas.add(c.id); recordarAbiertas();
  pickerAbierto=null; confirmando=null; renderEdit(); render(); guardarProductos();
  const inp = $("#nm-"+c.id); inp.focus(); inp.select();
};

/* ---------- Historial ---------- */
let diasAbiertos = new Set(), detalleAbierto = new Set(), resetAbierto = false;
const CLAVE_RESET = "1318";
$("#openHist").onclick = () => { diasAbiertos = new Set([hoyStr()]); detalleAbierto = new Set(); resetAbierto = false; renderHist(); $("#dlgHist").showModal(); };
const fechaLarga = f => { const [y,m,d] = f.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit"}); };
const ganTxt = r => r.conCosto ? pesos(r.ganancia) + (r.sinCosto ? "*" : "") : "—";
function renderHist(){
  const hoy = hoyStr(), d = new Date();
  const hace7 = new Date(d.getFullYear(), d.getMonth(), d.getDate()-6);
  const desde7 = hace7.getFullYear()+"-"+String(hace7.getMonth()+1).padStart(2,"0")+"-"+String(hace7.getDate()).padStart(2,"0");
  const mes = hoy.slice(0,7);
  const tile = (titulo, lista) => { const r = resumen(lista);
    return `<div class="tile"><small>${titulo} · ${r.n} ${r.n===1?"venta":"ventas"}</small><b>${pesos(r.total)}</b><span class="g">Ganancia ${ganTxt(r)}</span></div>`; };
  const porDia = {};
  for (const v of ventas) (porDia[v.fecha] ||= []).push(v);
  const fechas = Object.keys(porDia).sort().reverse();
  const hayFaltantes = ventas.some(v => v.items.some(i => typeof i.costo !== "number"));
  $("#histBody").innerHTML = `
    <div class="tiles">
      ${tile("Hoy", porDia[hoy]||[])}
      ${tile("Últimos 7 días", ventas.filter(v=>v.fecha>=desde7))}
      ${tile("Este mes", ventas.filter(v=>v.fecha.startsWith(mes)))}
    </div>
    ${hayFaltantes ? `<p class="note">* Hay productos vendidos sin costo cargado: no suman a la ganancia. Cargá el costo en “Cargar stock”.</p>` : ""}
    <div class="days">${fechas.length ? fechas.map(f => diaHTML(f, porDia[f])).join("") : `<p class="hint">Todavía no hay ventas registradas.</p>`}</div>
    ${ventas.length ? `<div class="reset">${resetAbierto ? `<form id="formReset" autocomplete="off">
        <span><b>Se van a borrar las ${ventas.length} ventas de todos los días.</b> Los productos, precios, stock y costos no se tocan. No se puede deshacer.</span>
        <div class="fila">
          <input class="num" type="password" inputmode="numeric" id="claveReset" placeholder="Clave" aria-label="Clave para borrar">
          <button type="submit" class="btn danger">Borrar todas las ventas</button>
          <button type="button" class="btn ghost" data-noreset>Cancelar</button>
        </div>
        <span class="err" id="errReset" hidden>Clave incorrecta.</span>
      </form>` : `<button type="button" class="btn danger sm" data-reset>Resetear ventas…</button>`}</div>` : ""}`;
  if (resetAbierto) $("#claveReset")?.focus();
}
function diaHTML(f, lista){
  const r = resumen(lista), abierto = diasAbiertos.has(f);
  let cuerpo = "";
  if (abierto) {
    const prods = {};
    for (const v of lista) for (const i of v.items) {
      const k = i.id + "|" + i.nombre;
      const x = prods[k] ||= {nombre:i.nombre, cant:0, total:0, gan:0, sinCosto:false};
      x.cant += i.cant; x.total += i.subtotal;
      if (typeof i.costo === "number") x.gan += (i.precio - i.costo) * i.cant; else x.sinCosto = true;
    }
    const filas = Object.values(prods).sort((a,b)=>b.cant-a.cant || b.total-a.total);
    const verProd = detalleAbierto.has(f);
    cuerpo = `<div class="in">
      <ol class="vlist">${lista.slice().reverse().map(v=> borrandoVenta===v.id ? confVentaHTML(v) : `<li>
          <span class="h">${hora24(v.hora)}</span>
          <span class="d">${v.mesa?`<b>Mesa ${v.mesa}</b> · `:""}${esc(v.items.map(i=>i.cant+" "+i.nombre).join(", "))}</span>
          <span class="a">${pesos(v.total)}</span>
          <button type="button" class="iconbtn" data-print="${v.id}" aria-label="Imprimir ticket N° ${v.numero} del ${fechaLarga(f)}">${SVG_PRINT}</button>
          <button type="button" class="iconbtn del" data-delv="${v.id}" aria-label="Borrar venta N° ${v.numero} del ${fechaLarga(f)}">${SVG_TRASH}</button>
        </li>`).join("")}</ol>
      <button type="button" class="btn ghost sm" data-det="${f}" aria-expanded="${verProd}">${verProd ? "Ocultar productos vendidos" : "Ver productos vendidos"}</button>
      ${verProd ? `<div class="tbl"><table>
        <thead><tr><th>Producto</th><th>Cant.</th><th>Vendido</th><th>Ganancia</th></tr></thead>
        <tbody>${filas.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${x.cant}</td><td>${pesos(x.total)}</td><td class="gan">${x.sinCosto && !x.gan ? "—" : pesos(x.gan)+(x.sinCosto?"*":"")}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Total</td><td>${filas.reduce((s,x)=>s+x.cant,0)}</td><td>${pesos(r.total)}</td><td class="gan">${ganTxt(r)}</td></tr></tfoot>
      </table></div>` : ""}
    </div>`;
  }
  return `<div class="dia" data-open="${abierto}">
    <button type="button" data-dia="${f}" aria-expanded="${abierto}">
      <span class="f">${fechaLarga(f)}${f===hoyStr()?" · hoy":""}<small>${r.n} ${r.n===1?"venta":"ventas"}</small></span>
      <span class="t">${pesos(r.total)}<small>Ganancia ${ganTxt(r)}</small></span>
      <span class="chev">${SVG_CHEV}</span>
    </button>${cuerpo}
  </div>`;
}
$("#histBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dia) { const f=b.dataset.dia; diasAbiertos.has(f)?diasAbiertos.delete(f):diasAbiertos.add(f); renderHist(); }
  if (b.hasAttribute("data-reset")) { resetAbierto = true; renderHist(); return; }
  if (b.hasAttribute("data-noreset")) { resetAbierto = false; renderHist(); return; }
  if (b.dataset.det) { const f=b.dataset.det; detalleAbierto.has(f)?detalleAbierto.delete(f):detalleAbierto.add(f); renderHist(); }
});
$("#histBody").addEventListener("submit", async e => {
  if (e.target.id !== "formReset") return;
  e.preventDefault();
  if ($("#claveReset").value !== CLAVE_RESET) { $("#errReset").hidden = false; $("#claveReset").value = ""; $("#claveReset").focus(); return; }
  const cuantas = ventas.length;
  resetAbierto = false;
  if (modo === "db") {
    setSave("busy","Borrando…");
    const ids = ventas.map(v => v.id);
    try { for (const id of ids) await db.collection("ventas").doc(id).delete(); setSave("ok","Guardado"); }
    catch { setSave("err","No se pudieron borrar todas"); toast("Algunas ventas no se borraron. Probá de nuevo."); return; }
  } else { ventas = []; guardarLocal(); }
  render(); renderHist(); toast(cuantas + (cuantas===1 ? " venta borrada" : " ventas borradas"));
});

/* ---------- Exportar / importar ---------- */
function hoyArchivo(){ return hoyStr(); }
$("#btnExport").onclick = async () => {
  const data = { app: "registro-polaco", formato: 1, exportado: new Date().toISOString(), productos, ventas };
  const nombre = `registro-polaco-${hoyArchivo()}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use("downloads") : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename: nombre, data: blob }); toast("Datos exportados"); }
    catch (e) { if (e?.code !== "declined") toast("No se pudo exportar"); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Datos exportados");
};
let pendienteImport = null;
$("#btnImport").onclick = () => { $("#fileImport").value = ""; $("#fileImport").click(); };
$("#fileImport").addEventListener("change", async e => {
  const f = e.target.files?.[0]; if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch { toast("Ese archivo no es un JSON válido"); return; }
  if (!d || !Array.isArray(d.productos) || !Array.isArray(d.ventas) || d.app !== "registro-polaco") {
    toast("Ese archivo no es una exportación del Registro Polaco"); return;
  }
  pendienteImport = d;
  const nP = d.productos.filter(x=>!esCarpeta(x)).length, nC = d.productos.filter(esCarpeta).length;
  const fecha = d.exportado ? new Date(d.exportado).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "fecha desconocida";
  $("#impBody").innerHTML = `<p style="margin:0"><b>${esc(f.name)}</b><br><span class="note">Exportado el ${fecha}</span></p>
    <div class="tiles">
      <div class="tile"><small>Productos</small><b>${nP}</b></div>
      <div class="tile"><small>Carpetas</small><b>${nC}</b></div>
      <div class="tile"><small>Ventas</small><b>${d.ventas.length}</b></div>
    </div>
    <p class="confirm" style="margin:0">Esto reemplaza todos los productos, el stock, los costos y las ventas que tenés ahora. No se puede deshacer, así que si querés guardá antes una copia con la flecha de exportar.</p>`;
  $("#dlgImport").showModal();
});
$("#impOk").onclick = async () => {
  const d = pendienteImport; if (!d) return;
  $("#dlgImport").close(); pendienteImport = null;
  const nuevosProd = JSON.parse(JSON.stringify(d.productos));
  const nuevasVentas = d.ventas.filter(v => v && v.id && v.fecha && Array.isArray(v.items));
  vaciar(carritoMostrador); irA(null);
  if (modo === "db") {
    setSave("busy","Importando…");
    try {
      await db.doc("registro/productos").set({items: nuevosProd});
      const quedan = new Set(nuevasVentas.map(v=>v.id));
      for (const v of ventas) if (!quedan.has(v.id)) await db.collection("ventas").doc(v.id).delete();
      for (const v of nuevasVentas) await db.collection("ventas").doc(v.id).set(v);
      setSave("ok","Guardado");
    } catch { setSave("err","La importación quedó incompleta"); toast("No se pudo importar todo. Probá de nuevo."); return; }
  } else { productos = nuevosProd; ventas = nuevasVentas.sort((a,b)=>a.ts-b.ts); guardarLocal(); }
  render(); toast("Datos importados");
};

function icoHTML(p){ return p.imagen ? `<img src="${esc(p.imagen)}" alt="">` : esc(p.icono||"🛒"); }
// Evita el zoom por doble toque en iPhone
let ultimoToque = 0;
document.addEventListener("touchend", e => {
  const ahora = Date.now();
  if (ahora - ultimoToque < 350 && e.target.closest("button")) { e.preventDefault(); e.target.closest("button").click(); }
  ultimoToque = ahora;
}, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,2200); }
let ventaCobrada = null;
function preguntarImpresion(v){
  ventaCobrada = v;
  $("#cobMesa").textContent = v.mesa ? `Cobrado · Mesa ${v.mesa}` : "Cobrado";
  $("#cobTotal").textContent = pesos(v.total);
  $("#dlgCobrado").showModal();
  $("#cobSi").focus();
}
$("#cobSi").onclick = () => { const v = ventaCobrada; $("#dlgCobrado").close(); if (v) imprimir(v); };
$("#cobNo").onclick = () => $("#dlgCobrado").close();
$("#cobDeshacer").onclick = () => { const v = ventaCobrada; $("#dlgCobrado").close(); if (v) deshacerVenta(v); };
$("#dlgCobrado").addEventListener("close", () => { ventaCobrada = null; });
function toastAccion(t, label, fn){
  const el=$("#toast"); el.innerHTML=""; const sp=document.createElement("span"); sp.textContent=t;
  const b=document.createElement("button"); b.className="undo"; b.type="button"; b.textContent=label;
  b.onclick=()=>{ el.hidden=true; clearTimeout(el._t); fn(); };
  el.append(sp,b); el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,6000);
}
iniciar();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
